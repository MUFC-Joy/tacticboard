<script>
/* 内嵌引擎适配层：只做排版微调，不改引擎逻辑与数据 */
(function(){
  var f=document.getElementById('engframe'); if(!f) return;
  function patch(){
    var d;
    try{ d=f.contentDocument; }catch(e){ return; }
    if(!d || !d.head) return;

    /* 1) 窄屏排版兜底 */
    if(!d.getElementById('tb-embed-patch')){
      var st=d.createElement('style'); st.id='tb-embed-patch';
      st.textContent=[
        '@media (max-width:430px){',
        ' .phead{flex-wrap:wrap; row-gap:2px}',
        ' .phead b{white-space:nowrap}',
        ' .phead .mut{font-size:10.5px}',
        ' .hbtn{white-space:nowrap; padding:4px 8px}',
        ' main{padding-left:10px; padding-right:10px}',
        ' #tabs button{font-size:12.5px}',
        '}'
      ].join('');
      d.head.appendChild(st);
    }

    /* 2) 小屏把比分牌收成紧凑版（只影响当前会话，不写回偏好） */
    try{
      var w=d.defaultView;
      if(w && w.innerHeight && w.innerHeight<720 && w.HUD && w.HUD.size==='standard'){
        w.HUD.size='compact';
        if(typeof w.applyHudPref==='function') w.applyHudPref();
      }
    }catch(e){}
  }
  f.addEventListener('load', patch);
  patch();
  /* 浏览器旋转/尺寸变化后补一次 */
  window.addEventListener('resize', function(){ setTimeout(patch,120); });
})();
</script>
